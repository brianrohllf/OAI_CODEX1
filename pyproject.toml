[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sleeper-fab-optimizer"
version = "0.1.0"
description = "Analyze Sleeper league history and optimize future FAAB bids"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "pandas>=2.2",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "typer>=0.12",
  "flask>=3.0",
]

[project.scripts]
fab-opt = "fab_optimizer.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.package-data]
"fab_optimizer" = ["templates/*.html"]
